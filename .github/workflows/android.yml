name: Build Python APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Проверка репозитория
      uses: actions/checkout@v4

    - name: Настройка Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Установка системных зависимостей
      run: |
        sudo apt update
        sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libsqlite3-dev cmake libffi-dev libssl-dev python3-pip python3-setuptools libltdl-dev

    - name: Установка Buildozer и Cython
      run: |
        pip3 install --upgrade pip
        pip3 install "buildozer>=1.5.0" "cython<3.0.0" virtualenv

    - name: Сборка APK с отладочным логом
      run: |
        # Принудительно чистим кэш платформы перед сборкой
        buildozer android clean
        # Запуск сборки с выводом всех внутренних ошибок компиляции
        buildozer -v android debug
      env:
        buildozer_log_level: 2

    - name: Сохранение готового APK
      uses: actions/upload-artifact@v4
      with:
        name: tictactoe-apk
        path: bin/*.apk
