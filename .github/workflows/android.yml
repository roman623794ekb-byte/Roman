name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build APK with Buildozer Action
        uses: ArtemisG0old/buildozer-action@v1
        with:
          repository_path: .
          command: buildozer -v android debug
          buildozer_version: stable

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberTicTacToe-APK
          path: .buildozer/android/platform/build-arm64-v8a/dists/cybertictactoe__arm64-v8a/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
