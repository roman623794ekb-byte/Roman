name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Официальное и поддерживаемое действие от команды Kivy/Buildozer
      - name: Build APK with Official Buildozer Action
        uses: kivy/buildozer-action@v1
        with:
          command: buildozer -v android debug

      # Современный и надёжный способ сохранения готового APK файла
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberTicTacToe-APK
          path: bin/*.apk
