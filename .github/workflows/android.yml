name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    # Явно фиксируем стабильную версию ОС вместо ubuntu-latest
    runs-on: ubuntu-22.04 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Устанавливаем все системные Android-зависимости вручную в стабильной Ubuntu
      - name: Install Buildozer and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev python3-setuptools
          pip3 install --user buildozer

      # Автоматически принимаем лицензии Google SDK, чтобы сборка не ждала нажатия кнопок
      - name: Accept Android SDK licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          export PATH=$PATH:~/.local/bin
          yes | buildozer -v android debug || true

      # Финальная упаковка игры в .apk файл
      - name: Build with Buildozer
        run: |
          export PATH=$PATH:~/.local/bin
          buildozer -v android debug

      # Сохранение скомпилированного мобильного приложения в артефакты GitHub
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberTicTacToe-APK
          path: bin/*.apk
